<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Athul K V — Java Full Stack Developer</title>
    <meta
      name="description"
      content="Athul K V — Java Full Stack Developer in Bangalore. Spring Boot, React and MySQL: REST APIs, relational schema design and secure role-based applications."
    />
    <meta name="theme-color" content="#F7F7F5" />
    <meta property="og:title" content="Athul K V — Java Full Stack Developer" />
    <meta
      property="og:description"
      content="Computer Science graduate building with Java, Spring Boot, React and MySQL. Open to Java, backend, frontend and full-stack developer roles."
    />
    <meta property="og:type" content="website" />
    <!-- Link preview card. After deploying, swap these for the absolute URL
         (https://your-domain/og.png) — LinkedIn in particular prefers it. -->
    <meta property="og:image" content="/og.png" />
    <meta property="og:image:width" content="1200" />
    <meta property="og:image:height" content="630" />
    <meta name="twitter:card" content="summary_large_image" />
    <meta name="twitter:title" content="Athul K V — Java Full Stack Developer" />
    <meta name="twitter:image" content="/og.png" />
    <link rel="icon" href="/favicon.svg" type="image/svg+xml" />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Anton&family=Playfair+Display:ital,wght@0,400;0,500;0,600;0,700;1,400&family=Inter:wght@400;500;600&family=JetBrains+Mono:wght@400;500&display=swap"
      rel="stylesheet"
    />
    <script>
      // Applied before paint so there is no theme flash.
      (function () {
        try {
          var stored = localStorage.getItem('theme')
          var dark = stored ? stored === 'dark' : false
          document.documentElement.classList.toggle('dark', dark)
          var meta = document.querySelector('meta[name="theme-color"]')
          if (meta) meta.setAttribute('content', dark ? '#0E1114' : '#F7F7F5')
        } catch (e) {}
      })()
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.jsx"></script>
  </body>
</html>
