<!doctype html>
<html lang="en" class="dark">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Athul K V — Backend &amp; Full-Stack Developer</title>
    <meta
      name="description"
      content="Athul K V — Computer Science Engineering graduate building backend systems with Java, Spring Boot, React and MySQL. Bangalore, India."
    />
    <meta name="theme-color" content="#0B0F19" />
    <meta property="og:title" content="Athul K V — Backend &amp; Full-Stack Developer" />
    <meta
      property="og:description"
      content="REST APIs, relational schema design, and secure role-based applications with Java, Spring Boot, React and MySQL."
    />
    <meta property="og:type" content="website" />
    <link rel="icon" href="/favicon.svg" type="image/svg+xml" />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=Space+Grotesk:wght@500;600;700&family=JetBrains+Mono:wght@400;500&display=swap"
      rel="stylesheet"
    />
    <script>
      // Applied before paint so there is no theme flash.
      (function () {
        try {
          var stored = localStorage.getItem('theme')
          var dark = stored ? stored === 'dark' : true
          document.documentElement.classList.toggle('dark', dark)
        } catch (e) {}
      })()
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.jsx"></script>
  </body>
</html>
